# Camera sources for Volcano Vigil.
#
# Every camera declares its license and attribution. A camera is fetched only
# when `enabled: true`. `track: false` keeps a camera out of the pipeline's hourly SAM
# tracking (it still gets free local verdicts).
# `ashcam_code` names the camera in the USGS AshCam archive (about 31 days of
# frames with exact capture times); `vigil-backfill` downloads from it.
# `live_source: ashcam` polls the archive instead of M.jpg: every 2-min (KPcam
# 5-min) frame with its exact capture time (docs/research/ashcam_latency.md).
# Each volcano's lat/lon (summit area, east positive) sets the sun's elevation
# for the quality gate's night check. utc_offset_hours gives the agent the volcano's local time.
# See DATA_SOURCES.md for the full record of each source and its terms.

volcanoes:
  kilauea:
    name: Kīlauea
    country: United States (Hawaiʻi)
    official_agency: USGS Hawaiian Volcano Observatory (HVO)
    official_url: https://www.usgs.gov/volcanoes/kilauea
    lat: 19.405    # Halemaʻumaʻu north vent (19.40496 N, 155.29022 W)
    lon: -155.290
    utc_offset_hours: -10   # HST

cameras:
  # --- USGS HVO, Kīlauea summit. Public domain; credit "U.S. Geological Survey". ---
  - id: kilauea-v1
    name: V1cam (Halemaʻumaʻu vents, PTZ)
    volcano: kilauea
    url: https://volcanoes.usgs.gov/cams/V1cam/images/M.jpg
    page_url: https://www.usgs.gov/volcanoes/kilauea/multimedia/webcams
    license: Public Domain (U.S. Geological Survey)
    attribution: U.S. Geological Survey
    ashcam_code: kilauea-v1-cam
    live_source: ashcam
    enabled: true
    track: false        # ingested for the fountaining alerts (config/alerts.yaml), never tracked hourly
    poll_minutes: 2
    notes: PTZ camera; pan/tilt/zoom and an HST timestamp are burned into the frame.
  - id: kilauea-k2
    name: K2cam (summit, fountain and lower plume, PTZ)
    volcano: kilauea
    url: https://volcanoes.usgs.gov/cams/K2cam/images/M.jpg
    page_url: https://www.usgs.gov/volcanoes/kilauea/multimedia/webcams
    license: Public Domain (U.S. Geological Survey)
    attribution: U.S. Geological Survey
    ashcam_code: kilauea-k2-cam
    live_source: ashcam
    enabled: true
    poll_minutes: 2
  - id: kilauea-v2
    name: V2cam
    volcano: kilauea
    url: https://volcanoes.usgs.gov/cams/V2cam/images/M.jpg
    page_url: https://www.usgs.gov/volcanoes/kilauea/multimedia/webcams
    license: Public Domain (U.S. Geological Survey)
    attribution: U.S. Geological Survey
    ashcam_code: kilauea-v2-cam
  - id: kilauea-v3
    name: V3cam
    volcano: kilauea
    url: https://volcanoes.usgs.gov/cams/V3cam/images/M.jpg
    page_url: https://www.usgs.gov/volcanoes/kilauea/multimedia/webcams
    license: Public Domain (U.S. Geological Survey)
    attribution: U.S. Geological Survey
    ashcam_code: kilauea-v3-cam
  - id: kilauea-kw
    name: KWcam
    volcano: kilauea
    url: https://volcanoes.usgs.gov/cams/KWcam/images/M.jpg
    page_url: https://www.usgs.gov/volcanoes/kilauea/multimedia/webcams
    license: Public Domain (U.S. Geological Survey)
    attribution: U.S. Geological Survey
    ashcam_code: kilauea-kw-cam
  - id: kilauea-b1
    name: B1cam
    volcano: kilauea
    url: https://volcanoes.usgs.gov/cams/B1cam/images/M.jpg
    page_url: https://www.usgs.gov/volcanoes/kilauea/multimedia/webcams
    license: Public Domain (U.S. Geological Survey)
    attribution: U.S. Geological Survey
    ashcam_code: kilauea-b1-cam
  - id: kilauea-kp
    name: KPcam (wide view, plume height)
    volcano: kilauea
