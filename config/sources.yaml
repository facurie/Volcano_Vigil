# Camera sources for Vigía Andino.
#
# Every camera declares its license and attribution. A camera is fetched only
# when `enabled: true`; sources without permission stay configured but disabled.
# See DATA_SOURCES.md for the full record of each source and its terms.

volcanoes:
  kilauea:
    name: Kīlauea
    country: United States (Hawaiʻi)
    official_agency: USGS Hawaiian Volcano Observatory (HVO)
    official_url: https://www.usgs.gov/volcanoes/kilauea
  nevado-del-ruiz:
    name: Nevado del Ruiz
    country: Colombia
    official_agency: Servicio Geológico Colombiano (SGC)
    official_url: https://www2.sgc.gov.co/Noticias/Paginas/Boletines-semanales.aspx

cameras:
  # --- USGS HVO, Kīlauea summit. Public domain; credit "U.S. Geological Survey". ---
  - id: kilauea-v1
    name: V1cam (Halemaʻumaʻu vents, PTZ)
    volcano: kilauea
    url: https://volcanoes.usgs.gov/cams/V1cam/images/M.jpg
    page_url: https://www.usgs.gov/volcanoes/kilauea/multimedia/webcams
    license: Public Domain (U.S. Geological Survey)
    attribution: U.S. Geological Survey
    enabled: false
    poll_minutes: 2
    notes: PTZ camera; pan/tilt/zoom and an HST timestamp are burned into the frame.
  - id: kilauea-k2
    name: K2cam (summit, fountain and lower plume, PTZ)
    volcano: kilauea
    url: https://volcanoes.usgs.gov/cams/K2cam/images/M.jpg
    page_url: https://www.usgs.gov/volcanoes/kilauea/multimedia/webcams
    license: Public Domain (U.S. Geological Survey)
    attribution: U.S. Geological Survey
    enabled: true
    poll_minutes: 2
  - id: kilauea-v2
    name: V2cam
    volcano: kilauea
