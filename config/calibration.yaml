# Camera calibration for measuring heights: where each camera stands and
# where it points (vigil/calibration.py, vigil/geometry.py).
#
# - vents: the point each volcano's heights are measured from.
# - cameras: the lens position (lat/lon and elevation, with one-sigma
#   uncertainties) and one preset per view. A PTZ camera gets a new preset
#   whenever its framing changes; a camera's presets must not overlap in time.
# - A preset's references fix the camera's azimuth, tilt, roll, focal length
#   and lens distortion by least squares (vigil.geometry.solve_view):
#     vent_pixel  where the vent appears: the fountain's axis and foot;
#     landmarks   pixels of points with published positions (GNIS, USGS);
#     celestial   pixels of the Moon's centre, with its apparent azimuth and
#                 elevation at the frame's capture time (scripts/moon_references.py);
#     horizon     pixels on the sea horizon, whose dip below level follows
#                 from the camera's elevation;
#     fov, roll, distortion   priors: the datasheet's field of view, the roll
#                 of a level pan-tilt-zoom mount, the radial distortion k1.
#   Pixels are (column, row) in the full-size frame, picked on frames the
#   preset covers. Check a preset with scripts/check_calibration.py.
# - Official eruption values never go in here; they only check the result.
#
# Sources: docs/research/kilauea_geometry_draft.yaml, docs/research/kilauea_webcams.md
# and docs/research/calibration_ep55.md.

vents:
  kilauea:
    lat: 19.40496      # north vent, the only vent that fountained in episode 55
    lon: -155.29022
    elev_m: 1080
    sigma_m: 10
    sigma_elev_m: 5
    source: >-
      Position published in the Patrick & Adams 2026 data release
      (https://data.usgs.gov/datacatalog/metadata/USGS.691cfaedd4be021d1d89b467.xml);
      the vents moved under 20 m in a year. Elevation 1,080 m from the Aug 28, 2026
      survey through episode 54
      (https://www.usgs.gov/media/images/september-8-2026-kilauea-summit-eruption-reference-map);
      1,075 m through episode 50.

cameras:
  kilauea-kp:
    volcano: kilauea
    position:
      lat: 19.492709
      lon: -155.385281
      elev_m: 2034
      sigma_m: 500
      sigma_elev_m: 15
      source: >-
        Estimated. HVO puts KPcam on the south flank of Mauna Loa at about 6,700 ft
        (2,042 m, rounded to 100 ft), serviced along the Mauna Loa trail; placed at the
        Mauna Loa Lookout (OSM node 5061563731): ground 2,032 m (USGS EPQS) plus a 2 m mast.
    presets:
      - name: fixed
        valid_from: "2026-09-25T00:00:00Z"
        image_size: [3840, 2160]
        distortion:
          k1: 0.0
          sigma: 1.0
          source: Free; the nine Moon positions, from the centre to the top-left corner, measure it.
        # The Moon's centre on clear AshCam frames: scripts/moon_references.py (JPL Horizons airless
        # topocentric position at the capture time, refraction for 792 hPa, circle fitted to the lit limb;
        # limb misfit 0.5-1.6 px). Evidence in docs/research/calibration_ep55.md.
        celestial:
          - {name: "Moon 20261016T2215Z", pixel: [490.1, 885.2], az_deg: 122.2104, el_deg: 5.7648}
          - {name: "Moon 20261016T2230Z", pixel: [589.3, 710.5], az_deg: 123.6700, el_deg: 8.6078}
          - {name: "Moon 20261016T2245Z", pixel: [695.5, 539.1], az_deg: 125.2388, el_deg: 11.4180}
          - {name: "Moon 20261016T2300Z", pixel: [809.8, 370.7], az_deg: 126.9254, el_deg: 14.1814}
          - {name: "Moon 20261016T2315Z", pixel: [930.4, 208.8], az_deg: 128.7394, el_deg: 16.8880}
          - {name: "Moon 20261019T0045Z", pixel: [627.9, 127.5], az_deg: 123.4620, el_deg: 17.9432}
          - {name: "Moon 20261020T0045Z", pixel: [66.5, 562.4], az_deg: 114.7288, el_deg: 10.5607}
          - {name: "Moon 20261020T0100Z", pixel: [174.7, 370.3], az_deg: 116.2394, el_deg: 13.6701}
          - {name: "Moon 20261020T0115Z", pixel: [293.2, 181.0], az_deg: 117.8590, el_deg: 16.7469}
        note: Fixed camera; the same framing (tree, skyline) on every AshCam morning from Sep 28 to Oct 27.
  kilauea-k2:
    volcano: kilauea
    position:
      lat: 19.4200
      lon: -155.2889
      elev_m: 1245
      sigma_m: 75
      sigma_elev_m: 5
      source: >-
        Estimated. On the Uēkahuna bluff, about 70 m north of the overlook platform in its
        foreground (OSM node 582340071): ground 1,243 m (USGS EPQS) plus 2 m.
    presets:
      - &k2_ep55
        name: ep55
        valid_from: "2026-10-17T00:00:00Z"
        valid_until: "2026-10-18T00:00:00Z"
        image_size: [3840, 2160]
        fov:
          hfov_deg: 58.5
          sigma_deg: 1.5
          source: >-
            Widest zoom of the AXIS Q6318-LE, 58.5-2.3 deg (https://www.axis.com/products/axis-q6318-le). K2cam is
            HVO's one snapshot PTZ camera, which Patrick et al. 2026 (doi:10.1186/s13617-026-00170-x) name as an
            Axis Q6318. The Phase 3 fit of the 3DEP skyline with Pu'ukoa'e, made without this prior, had a solution
            at 57.8 deg (the other, 84.3 deg, is wider than the lens), so the camera was at its widest zoom. The
            sigma covers the unmeasured barrel distortion (up to ~3 % on the focal length) and the spread between units.
        roll:
          deg: 0.0
          sigma_deg: 1.0
          source: A pan-tilt-zoom camera on a level mount.
        distortion:
          k1: 0.0
          sigma: 0.05
          source: Not measured; a zoom lens at its wide end bends little, and the fountain sits near the centre column.
        landmarks:
          - name: Puʻukoaʻe
            pixel: [2992, 1629]
            sigma_px: [3.0, 3.0]
            lat: 19.35528
            lon: -155.32235
            elev_m: 979
            sigma_m: 50
            sigma_elev_m: 10
            source: >-
              GNIS summit point; ground elevation from USGS EPQS. The hump on the right-hand skyline, 8.0 km away at
              206 deg; its pixel holds within 2 px on the 07:00, 08:00 and 09:00 HST frames.
        note: >-
          PTZ without a readout; the framing held through episode 55 (frames register within 4 px). The vent is a
          check, not a reference: its bearing depends on the camera's estimated position (+/-75 m at 1,678 m).
      - <<: *k2_ep55   # the same references and priors: the framing has not changed since episode 55
        name: live
        valid_from: "2026-10-18T00:00:00Z"
        valid_until: null
        framing:
          references:
            - path: frames/kilauea-k2/2026-10-17/20261017T192802Z_75366d46.jpg
              sha256: 75366d46129bcc0aa85aebba24ca9cb4fa2c17a6c68b2e516732d3ca3a214f72
              note: Daylight, 09:28 HST after episode 55; matches daylight frames.
            - path: frames/kilauea-k2/2026-10-17/20261017T123001Z_7ffa63d8.jpg
              sha256: 7ffa63d848f01209c13def7b90cb2288a680d50167dc192fcd5f7f3e6bcd0551
              note: Night, 02:30 HST before episode 55, lit by the path lamps; matches dark frames.
          rows_from: 0.80
          skip_columns: [0.40, 0.62]
          source: >-
            Both frames ship in the episode 55 mirror (frames/**). The compared rows hold the overlook in the
            foreground; the left-out columns 1,536-2,381 hold the vent (projected at column 1,670), its fountain,
            glow and plume. Calibrated on K2cam's frames of Oct 16 to Nov 2 (docs/research/calibration_ep55.md).
        note: >-
          Live use from Oct 18. A frame is measured only while it shows ep55's framing (vigil.framing); K2cam's
          frame of Nov 2 20:58Z registers within 4 px of Oct 17.
