[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "volcano-vigil"
version = "0.1.0"
description = "An agent that watches public volcano webcams and turns frames into measurements and bilingual bulletins, using Meta's Muse Spark and SAM 3.1."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "openai>=1.60",
    "meta-sam-parser>=0.1.0",
    "pillow>=10.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "huggingface_hub>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
vigil-track = "vigil.tracking:main"
vigil-ingest = "vigil.ingest.worker:main"
vigil-backfill = "vigil.ingest.ashcam:main"
vigil-quality = "vigil.gate:main"
vigil-measure = "vigil.metrics:main"
vigil-wind = "vigil.wind:main"
vigil-agent = "vigil.agent.loop:main"
vigil-bulletin = "vigil.agent.bulletin:main"
vigil-pipeline = "vigil.pipeline:main"
vigil-replay = "vigil.replay:main"
vigil-web = "vigil.web.app:main"
vigil-mirror = "vigil.mirror:main"
vigil-persist = "vigil.persist:main"
vigil-space = "vigil.space:main"
vigil-telegram = "vigil.telegram:main"
vigil-alerts = "vigil.alerts:main"

[tool.setuptools.packages.find]
include = ["vigil*"]

[tool.setuptools.package-data]
"vigil.web" = ["static/*.html", "static/css/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
