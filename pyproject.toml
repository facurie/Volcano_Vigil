[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vigia-andino"
version = "0.1.0"
description = "An agent that watches public volcano webcams and turns frames into measurements and bilingual bulletins, using Meta's Muse Spark and SAM 3.1."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "openai>=1.60",
    "meta-sam-parser>=0.1.0",
    "pillow>=10.4",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
]

[project.scripts]
vigia-track = "vigia.tracking:main"
vigia-ingest = "vigia.ingest.worker:main"
vigia-backfill = "vigia.ingest.ashcam:main"
vigia-quality = "vigia.gate:main"
vigia-measure = "vigia.metrics:main"

[tool.setuptools.packages.find]
include = ["vigia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
